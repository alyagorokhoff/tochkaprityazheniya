name: Deploy Point of Attraction to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - github-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact source from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prepare temporary GitHub Pages build config
        shell: bash
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const repo = "tochkaprityazheniya";

          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            basePath: `/${repo}`,
            assetPrefix: `/${repo}/`,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
          };

          export default nextConfig;
          EOF

      - name: Build static export
        run: npx next build

      - name: Fix root-relative public asset paths for project Pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("out")
          prefix = "/tochkaprityazheniya"

          replacements = {
              '"/assets/': f'"{prefix}/assets/',
              '"/reviews/': f'"{prefix}/reviews/',
              '"/constellation/': f'"{prefix}/constellation/',
              '"/fonts/': f'"{prefix}/fonts/',
              '"/favicon.svg': f'"{prefix}/favicon.svg',
              "'/assets/": f"'{prefix}/assets/",
              "'/reviews/": f"'{prefix}/reviews/",
              "'/constellation/": f"'{prefix}/constellation/",
              "'/fonts/": f"'{prefix}/fonts/",
              "'/favicon.svg": f"'{prefix}/favicon.svg",
              'url("/assets/': f'url("{prefix}/assets/',
              'url("/fonts/': f'url("{prefix}/fonts/',
              "url('/assets/": f"url('{prefix}/assets/",
              "url('/fonts/": f"url('{prefix}/fonts/",
              'url(/assets/': f'url({prefix}/assets/',
              'url(/fonts/': f'url({prefix}/fonts/',
          }

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".html", ".css", ".js", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Embed visual assets for GitHub Pages reliability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import mimetypes
          import sys

          root = Path("out")
          prefix = "/tochkaprityazheniya/"

          extra_types = {
              ".webp": "image/webp",
              ".png": "image/png",
              ".svg": "image/svg+xml",
              ".ttf": "font/ttf",
              ".woff": "font/woff",
              ".woff2": "font/woff2",
          }

          def encode_file(path):
              mime = extra_types.get(path.suffix.lower()) or mimetypes.guess_type(path.name)[0] or "application/octet-stream"
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              return f"data:{mime};base64,{encoded}"

          css_assets = []
          for folder in ("assets", "fonts"):
              folder_path = root / folder
              if folder_path.exists():
                  css_assets.extend(path for path in folder_path.rglob("*") if path.is_file())

          for css_path in root.rglob("*.css"):
              css = css_path.read_text(encoding="utf-8")
              for asset in css_assets:
                  relative = asset.relative_to(root).as_posix()
                  url = prefix + relative
                  uri = encode_file(asset)
                  css = css.replace(f'url("{url}")', f'url("{uri}")')
                  css = css.replace(f"url('{url}')", f'url("{uri}")')
                  css = css.replace(f"url({url})", f'url("{uri}")')
              css_path.write_text(css, encoding="utf-8")

          html_assets = []
          for folder in ("assets", "reviews", "constellation"):
              folder_path = root / folder
              if folder_path.exists():
                  html_assets.extend(path for path in folder_path.rglob("*") if path.is_file())

          changed = 0
          for html_path in root.rglob("*.html"):
              html = html_path.read_text(encoding="utf-8")
              before = html
              for asset in html_assets:
                  relative = asset.relative_to(root).as_posix()
                  url = prefix + relative
                  html = html.replace(f'src="{url}"', f'src="{encode_file(asset)}"')
              if html != before:
                  changed += 1
              html_path.write_text(html, encoding="utf-8")

          if changed == 0:
              print("No visible HTML images were embedded.")
              sys.exit(1)

          print(f"Embedded visible images into {changed} HTML files and embedded CSS assets.")
          PY

      - name: Inline compiled CSS for GitHub Pages reliability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path("out")
          css_files = sorted((root / "_next" / "static" / "chunks").glob("*.css"))
          if not css_files:
              print("No compiled CSS files found.")
              sys.exit(1)

          css = "\n".join(path.read_text(encoding="utf-8") for path in css_files)
          style = "<style data-github-pages-inline-css>" + css + "</style>"

          changed = 0
          for html_path in root.rglob("*.html"):
              html = html_path.read_text(encoding="utf-8")
              if "data-github-pages-inline-css" in html:
                  continue
              if "</head>" not in html:
                  continue
              html = html.replace("</head>", style + "</head>", 1)
              html_path.write_text(html, encoding="utf-8")
              changed += 1

          if changed == 0:
              print("No HTML files received inline CSS.")
              sys.exit(1)

          print(f"Inlined compiled CSS into {changed} HTML files.")
          PY

      - name: Protect Next static directory from Jekyll
        run: touch out/.nojekyll

      - name: Verify exported asset paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("out")
          bad = []
          patterns = [
              r'(?<!tochkaprityazheniya)/assets/',
              r'(?<!tochkaprityazheniya)/reviews/',
              r'(?<!tochkaprityazheniya)/constellation/',
              r'(?<!tochkaprityazheniya)/fonts/',
              r'(?<!tochkaprityazheniya)/favicon\\.svg',
          ]

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".html", ".css", ".js", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if re.search(pattern, text):
                      bad.append(f"{path}: {pattern}")

          if bad:
              print("Unprefixed GitHub Pages asset paths remain:")
              print("\\n".join(bad[:100]))
              sys.exit(1)

          index_html = (root / "index.html").read_text(encoding="utf-8")
          if 'src="/tochkaprityazheniya/reviews/' in index_html or 'src="/tochkaprityazheniya/constellation/' in index_html:
              print("Visible images are still external instead of embedded.")
              sys.exit(1)
          if "data:image/webp;base64," not in index_html or "data:image/png;base64," not in index_html:
              print("Expected embedded review/constellation images were not found.")
              sys.exit(1)
          if "data-github-pages-inline-css" not in index_html:
              print("Compiled CSS was not inlined into index.html")
              sys.exit(1)

          required = [
              root / "index.html",
              root / "_next",
              root / "assets" / "hero-cosmic.webp",
              root / "reviews" / "review-01.webp",
              root / "constellation" / "archetype.png",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              print("Missing exported files:")
              print("\\n".join(missing))
              sys.exit(1)

          print("GitHub Pages export paths verified.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
