name: Deploy Point of Attraction to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - github-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact source from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prepare temporary GitHub Pages build config
        shell: bash
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const repo = "tochkaprityazheniya";

          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            basePath: `/${repo}`,
            assetPrefix: `/${repo}/`,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
          };

          export default nextConfig;
          EOF

      - name: Build static export
        run: npx next build

      - name: Fix root-relative public asset paths for project Pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("out")
          prefix = "/tochkaprityazheniya"

          replacements = {
              '"/assets/': f'"{prefix}/assets/',
              '"/reviews/': f'"{prefix}/reviews/',
              '"/constellation/': f'"{prefix}/constellation/',
              '"/fonts/': f'"{prefix}/fonts/',
              '"/favicon.svg': f'"{prefix}/favicon.svg',
              "'/assets/": f"'{prefix}/assets/",
              "'/reviews/": f"'{prefix}/reviews/",
              "'/constellation/": f"'{prefix}/constellation/",
              "'/fonts/": f"'{prefix}/fonts/",
              "'/favicon.svg": f"'{prefix}/favicon.svg",
              'url("/assets/': f'url("{prefix}/assets/',
              'url("/fonts/': f'url("{prefix}/fonts/',
              "url('/assets/": f"url('{prefix}/assets/",
              "url('/fonts/": f"url('{prefix}/fonts/",
              'url(/assets/': f'url({prefix}/assets/',
              'url(/fonts/': f'url({prefix}/fonts/',
          }

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".html", ".css", ".js", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Inline compiled CSS for GitHub Pages reliability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("out")
          link_pattern = re.compile(r'<link[^>]*href="([^"]+\\.css)"[^>]*>')

          for html_path in root.rglob("*.html"):
              html = html_path.read_text(encoding="utf-8")

              def replace_link(match):
                  href = match.group(1)
                  prefix = "/tochkaprityazheniya/"
                  if not href.startswith(prefix):
                      return match.group(0)
                  relative = href[len(prefix):]
                  css_path = root / relative
                  if not css_path.exists() or css_path.suffix != ".css":
                      return match.group(0)
                  css = css_path.read_text(encoding="utf-8")
                  return "<style data-github-pages-inline-css>" + css + "</style>"

              html = link_pattern.sub(replace_link, html)
              html_path.write_text(html, encoding="utf-8")
          PY

      - name: Protect Next static directory from Jekyll
        run: touch out/.nojekyll

      - name: Verify exported asset paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("out")
          bad = []
          patterns = [
              r'(?<!tochkaprityazheniya)/assets/',
              r'(?<!tochkaprityazheniya)/reviews/',
              r'(?<!tochkaprityazheniya)/constellation/',
              r'(?<!tochkaprityazheniya)/fonts/',
              r'(?<!tochkaprityazheniya)/favicon\\.svg',
          ]

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".html", ".css", ".js", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  if re.search(pattern, text):
                      bad.append(f"{path}: {pattern}")

          if bad:
              print("Unprefixed GitHub Pages asset paths remain:")
              print("\\n".join(bad[:100]))
              sys.exit(1)

          index_html = (root / "index.html").read_text(encoding="utf-8")
          if "data-github-pages-inline-css" not in index_html:
              print("Compiled CSS was not inlined into index.html")
              sys.exit(1)

          required = [
              root / "index.html",
              root / "_next",
              root / "assets" / "hero-cosmic.webp",
              root / "reviews" / "review-01.webp",
              root / "constellation" / "archetype.png",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              print("Missing exported files:")
              print("\\n".join(missing))
              sys.exit(1)

          print("GitHub Pages export paths verified.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
